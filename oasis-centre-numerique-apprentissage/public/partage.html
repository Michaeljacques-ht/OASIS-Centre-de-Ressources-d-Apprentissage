<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partage de ressources - OASIS</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="app"></div>
<script src="/js/app.js"></script>
<script>
const partage = [
  ['PDF', 'Guide de préparation d’un cours efficace', 'Un guide pratique pour planifier et animer un cours interactif.', ['Pédagogie', 'Guide'], '1.2K vues'],
  ['PPT', 'Présentation : Les fractions', 'Diaporama complet avec exercices et exemples.', ['Mathématiques', 'NS2'], '876 vues'],
  ['XLS', 'Tableau de suivi des élèves', 'Modèle de suivi des résultats et des compétences.', ['Gestion de classe'], '642 vues'],
  ['VID', 'Expérience : La photosynthèse', 'Vidéo explicative et questions de compréhension.', ['Sciences', 'Expérience'], '1.5K vues'],
  ['DOC', 'Fiche d’activité : Rédaction', 'Activité guidée pour améliorer la rédaction.', ['Français'], '403 vues'],
  ['IMG', 'Carte de l’Amérique', 'Carte géographique détaillée à utiliser en classe.', ['Géographie'], '298 vues']
];

const contenu = `
  <section class="dash-hero">
    <h1>Partage de ressources</h1>
    <p>Partagez, découvrez et réutilisez des ressources de qualité pour enrichir vos cours et vos pratiques pédagogiques.</p>
    <div class="hero-chips"><span>Partager vos ressources</span><span>Collaborer avec vos collègues</span><span>Enrichir vos enseignements</span></div>
  </section>
  <div class="dash-stats">
    ${statCard('▧', '1.2K', 'Tous les types')}
    ${statCard('DOC', '412', 'Documents', 'purple')}
    ${statCard('PPT', '235', 'Présentations', 'orange')}
    ${statCard('▷', '168', 'Vidéos', 'pink')}
    ${statCard('IMG', '94', 'Images', 'green')}
  </div>
  <div class="filters-modern">
    <select><option>Discipline : Toutes</option></select>
    <select><option>Niveau : Tous</option></select>
    <select><option>Type : Tous</option></select>
    <input placeholder="Rechercher une ressource...">
    <button class="btn btn-contour">Filtres</button>
  </div>
  <div class="section-head"><h2>Ressources récentes</h2><a href="#">Mode liste</a></div>
  <div class="resource-list">
    ${partage.map(r => resourceRow(r[0], r[1], r[2], r[3], r[4])).join('')}
  </div>
`;

const droite = `
  <div class="side-card">
    <h3>Actions rapides</h3>
    ${quickAction('+', 'Partager une ressource', 'Publier un fichier ou un lien', '/dashboard')}
    ${quickAction('⇧', 'Importer depuis mon appareil', 'Téléverser un fichier', '#')}
    ${quickAction('□', 'Créer un dossier', 'Organiser vos ressources', '#')}
    ${quickAction('♙', 'Mes ressources partagées', 'Gérer vos partages', '/dashboard')}
  </div>
  <div class="side-card">
    <h3>Aperçu du partage</h3>
    <div class="card-grid-2">
      ${statCard('⇄', '1.2K', 'Ressources partagées')}
      ${statCard('⇩', '12K', 'Téléchargements', 'green')}
      ${statCard('↻', '1.2K', 'Réutilisations', 'purple')}
      ${statCard('♙', '24', 'Collègues abonnés', 'orange')}
    </div>
  </div>
  <div class="side-card">
    <h3>Ressources populaires <a href="/catalogue">Voir tout</a></h3>
    ${featuredList([
      { titre: 'Guide d’évaluation par compétences', meta: '3.2K' },
      { titre: 'Exercices corrigés : Mathématiques NS3', meta: '2.4K' },
      { titre: 'Méthodes actives d’enseignement', meta: '1.9K' },
      { titre: 'Plan de cours : Sciences NS4', meta: '1.7K' }
    ])}
  </div>
`;

document.getElementById('app').innerHTML = appShell('partage', contenu, droite, {
  search: 'Rechercher une ressource, un fichier, un sujet...',
  action: '<a class="btn btn-bleu btn-petit" href="/dashboard">+ Partager une ressource</a>'
});
</script>
</body>
</html>
