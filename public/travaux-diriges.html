<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travaux dirigés enseignants - OASIS</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="app"></div>
<script src="/js/app.js"></script>
<script>
const tds = [
  { icon: "÷", titre: "TD : Équations et inéquations du premier degré", meta: "20 exercices · Difficulté : Moyenne · 45 min", tags: ["Mathématiques", "Secondaire 4", "Algèbre"], dates: "Créé le 15/05/2024<br>Modifié le 20/05/2024" },
  { icon: "⌘", titre: "TD : Les lois de l’électricité", meta: "18 exercices · Difficulté : Moyenne · 40 min", tags: ["Sciences physiques", "Secondaire 3", "Électricité"], dates: "Créé le 12/05/2024<br>Modifié le 18/05/2024" },
  { icon: "◉", titre: "TD : La photosynthèse et la respiration cellulaire", meta: "15 exercices · Difficulté : Facile · 35 min", tags: ["Sciences de la vie", "Secondaire 2", "Biologie"], dates: "Créé le 10/05/2024<br>Modifié le 11/05/2024" },
  { icon: "◎", titre: "TD : Les climats du monde", meta: "12 exercices · Difficulté : Moyenne · 30 min", tags: ["Histoire-Géo", "Secondaire 4", "Géographie"], dates: "Créé le 08/05/2024<br>Modifié le 09/05/2024" },
  { icon: "Aa", titre: "TD : Reported speech (Discours rapporté)", meta: "16 exercices · Difficulté : Facile · 25 min", tags: ["Anglais", "Secondaire 3", "Grammaire"], dates: "Créé le 05/05/2024<br>Modifié le 06/05/2024" }
];

function ligneTD(td) {
  return `<article class="object-row">
    <span class="object-check"></span><span class="object-icon">${td.icon}</span>
    <div><b>${td.titre}</b><div>${td.tags.map(t => `<em class="pill">${t}</em>`).join(" ")}</div><p>${td.meta}</p></div>
    <small class="object-meta">${td.dates}</small>
    <div class="object-actions"><button title="Voir">⌕</button><button title="Modifier">✎</button><button title="Dupliquer">□</button><button title="Partager">⇄</button><button title="Plus">⋮</button></div>
  </article>`;
}

const contenu = `
  <section class="dash-hero">
    <h1>Travaux dirigés - Enseignants</h1>
    <p>Concevez des travaux dirigés structurés pour guider vos élèves, développer leurs compétences et suivre leur progression.</p>
    <a class="btn btn-contour" href="/apropos" style="margin-top:6px">Guide d’utilisation</a>
  </section>
  <div class="tabs-modern"><button class="actif">Tous les TD</button><button>Par discipline</button><button>Par niveau</button><button>Mes TD</button><button>TD partagés avec moi</button><button>Favoris</button></div>
  <div class="category-scroll">
    ${[["√x","Mathématiques","124 TD"],["⚗","Sciences physiques","98 TD"],["◉","Sciences de la vie","76 TD"],["▥","Français","89 TD"],["◎","Histoire-Géo","67 TD"],["Aa","Anglais","54 TD"],["…","Autres disciplines","32 TD"]].map(c => `<a class="mini-category" href="#"><span>${c[0]}</span><div><b>${c[1]}</b><small>${c[2]}</small></div></a>`).join("")}
  </div>
  <div class="filters-modern">
    <select><option>Niveau scolaire : Tous</option></select><select><option>Type de TD : Tous</option></select><select><option>Difficulté : Toutes</option></select><select><option>Format : Tous</option></select><input placeholder="Rechercher dans mes TD..."><button class="btn btn-contour">Filtres</button>
  </div>
  <div class="section-head"><h2>428 travaux dirigés trouvés</h2><a href="#">Trier par : Plus récents</a></div>
  <div class="object-list">${tds.map(ligneTD).join("")}</div>
  <div class="pagination"><button>‹</button><button class="actif">1</button><button>2</button><button>3</button><span>…</span><button>9</button><button>›</button></div>
`;

const droite = `
  <div class="side-card"><h3>Mes statistiques <a href="#">Voir le rapport</a></h3><div class="stat-line"><span><b>428</b><small>TD créés</small></span><span><b>76</b><small>Partagés</small></span><span><b>1 248</b><small>Utilisations</small></span><span><b>92%</b><small>Engagement</small></span></div><div class="bar-chart"><span style="height:45%"></span><span style="height:80%"></span><span style="height:60%"></span><span style="height:74%"></span><span style="height:52%"></span><span style="height:70%"></span></div></div>
  <div class="side-card"><h3>Actions rapides</h3>
    ${quickAction("+", "Créer un nouveau TD", "Commencer un TD à partir de zéro", "/creer-travail-dirige")}
    ${quickAction("⇧", "Importer un TD", "Importer depuis Word, PDF ou Excel", "#")}
    ${quickAction("□", "Dupliquer un TD existant", "Gagner du temps avec un modèle", "#")}
    ${quickAction("⇄", "Partager une collection", "Partager plusieurs TD à la fois", "#")}
  </div>
  <div class="side-card"><h3>TD populaires <a href="#">Voir tout</a></h3>${featuredList([{titre:"Les fonctions linéaires", meta:"1.2k vues"},{titre:"Les grandes révolutions", meta:"987 vues"},{titre:"La cellule et ses organites", meta:"876 vues"},{titre:"Les réactions chimiques", meta:"765 vues"},{titre:"Vocabulary: Travel & Tourism", meta:"654 vues"}])}</div>
  <div class="side-card orange-callout"><h3>Conseil pédagogique</h3><p>Variez les types d’exercices et proposez des situations-problèmes pour développer l’autonomie.</p></div>
`;

document.getElementById("app").innerHTML = appShell("td", contenu, droite, {
  search: "Rechercher un travail dirigé, une matière, un thème...",
  action: '<a class="btn btn-bleu btn-petit" href="/creer-travail-dirige">+ Créer un travail dirigé</a>'
});
</script>
</body>
</html>
