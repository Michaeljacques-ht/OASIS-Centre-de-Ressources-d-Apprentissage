<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouveau laboratoire virtuel - OASIS</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="app"></div>
<script src="/js/app.js"></script>
<script>
const contenu = `
  <section style="display:flex;gap:16px;align-items:center;margin:8px 0 18px">
    <span class="row-icon" style="width:64px;height:64px;font-size:32px">⚗</span>
    <div><h1>Nouveau laboratoire virtuel</h1><p style="color:var(--texte-2)">Créez un nouveau laboratoire ou une simulation interactive pour vos élèves.</p></div>
  </section>
  ${wizardSteps(['Informations générales','Contenu et scénarios','Paramètres pédagogiques','Ressources et configuration','Publication'])}
  <div class="builder-layout">
    <section>
      <div class="form-panel">
        <h3>Informations générales</h3>
        <div class="form-grid">
          <div class="champ"><label>Titre du laboratoire *</label><input id="lab-titre" placeholder="Ex. : Réactions acide-base et calcul du pH"></div>
          <div class="champ"><label>Discipline *</label><select id="lab-discipline"><option>Chimie</option><option>Physique</option><option>Biologie</option><option>Mathématiques</option></select></div>
          <div class="champ"><label>Niveau scolaire cible *</label><select id="lab-niveau"><option>Secondaire 2</option><option>Secondaire 3</option><option>Secondaire 4</option><option>Secondaire 5</option></select></div>
          <div class="champ"><label>Sous-discipline</label><select id="lab-sous-discipline"><option>Acide-base</option><option>Mécanique</option><option>Cellule</option><option>Fonctions</option></select></div>
        </div>
        <h3 style="margin-top:18px">Type de laboratoire *</h3>
        <div class="choice-grid">
          <label class="choice-card actif" data-lab-type="Expérience guidée" onclick="choisirTypeLab(this)"><span>⚗</span><b>Expérience guidée</b><small>Étapes prédéfinies</small></label>
          <label class="choice-card" data-lab-type="Exploration libre" onclick="choisirTypeLab(this)"><span>△</span><b>Exploration libre</b><small>Accès libre aux outils</small></label>
          <label class="choice-card" data-lab-type="Simulation théorique" onclick="choisirTypeLab(this)"><span>∑</span><b>Simulation théorique</b><small>Modélisation de concepts</small></label>
          <label class="choice-card" data-lab-type="Démo interactive" onclick="choisirTypeLab(this)"><span>▷</span><b>Démo interactive</b><small>Présentation dynamique</small></label>
        </div>
        <div style="margin-top:18px"><div class="champ"><label>Brève description *</label><textarea id="lab-description" rows="4" placeholder="Décrivez brièvement les objectifs, les concepts abordés et ce que les élèves apprendront..."></textarea></div></div>
      </div>
      <div class="form-panel">
        <h3>Média d’illustration</h3>
        <div class="upload-grid">
          <div><label><b>Image de couverture *</b></label><div class="upload-zone">▧<br>Glisser-déposer une image ici<br><button class="btn btn-contour btn-petit">Choisir un fichier</button><small>JPG, PNG · max. 2 Mo</small></div></div>
          <div><label><b>Vidéo de présentation</b></label><div class="upload-zone">▷<br>Glisser-déposer une vidéo ici<br><button class="btn btn-contour btn-petit">Choisir un fichier</button><small>MP4, WebM · max. 50 Mo</small></div></div>
        </div>
        <div class="footer-action"><a class="btn btn-contour" href="/laboratoire">Annuler</a><button class="btn btn-bleu" onclick="sauverLaboratoire(true)">Suivant →</button></div>
      </div>
    </section>
    <aside>
      <div class="preview-card"><h3>Aperçu en direct</h3><div class="preview-visual">⚗</div><h3>Titre du laboratoire <span class="pill purple">Discipline</span></h3><p class="stars">★★★★☆ <small>(0)</small></p><p style="color:var(--texte-2)">Brève description du laboratoire apparaîtra ici...</p></div>
      <div class="preview-card soft-callout"><h3>Conseils pour un bon laboratoire</h3><p>Définissez des objectifs clairs, choisissez des scénarios réalistes, intégrez des questions et testez le laboratoire avant publication.</p></div>
      <div class="preview-card orange-callout"><h3>Bon à savoir</h3><p>Vous pourrez modifier les informations et le contenu à tout moment, même après publication.</p></div>
    </aside>
  </div>
`;

document.getElementById('app').innerHTML = appShell('nouveau-laboratoire', contenu, '', {
  search: 'Rechercher un laboratoire, une simulation, une expérience...',
  action: '<button class="btn btn-bleu btn-petit" onclick="sauverLaboratoire()">Enregistrer</button>'
});

function choisirTypeLab(el) {
  document.querySelectorAll('[data-lab-type]').forEach(card => card.classList.remove('actif'));
  el.classList.add('actif');
}

async function sauverLaboratoire(rediriger = false) {
  const titre = valeurChamp('lab-titre');
  if (!titre) return toast('Le titre du laboratoire est obligatoire.', 'erreur');
  const type = (document.querySelector('[data-lab-type].actif') || {}).dataset?.labType || 'Expérience guidée';
  await posterCreation('/api/laboratoires', {
    titre,
    discipline: valeurChamp('lab-discipline'),
    niveau: valeurChamp('lab-niveau'),
    sousDiscipline: valeurChamp('lab-sous-discipline'),
    type,
    typeLaboratoire: type,
    description: valeurChamp('lab-description'),
    objectifs: valeurChamp('lab-description'),
    statut: 'brouillon',
    visibilite: 'prive'
  }, rediriger ? '/laboratoire' : '');
}
</script>
</body>
</html>
