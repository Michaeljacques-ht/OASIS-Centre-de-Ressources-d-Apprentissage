<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Se connecter — OASIS</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="conteneur">
  <div class="panneau form-carte">
    <div style="text-align:center;margin-bottom:16px"><img src="/assets/oasis-logo.jpg" alt="OASIS" style="width:84px;height:84px;border-radius:50%;object-fit:cover"></div>
    <h1 style="font-size:22px;margin-bottom:4px;text-align:center">Connexion à OASIS</h1>
    <p style="color:var(--texte-2);font-size:13.5px;margin-bottom:18px;text-align:center">Accédez à votre espace personnel d’apprentissage.</p>
    <div class="alerte" id="alerte"></div>
    <div class="champ"><label for="email">Adresse courriel</label>
      <input id="email" type="email" placeholder="vous@exemple.ht" autocomplete="email"></div>
    <div class="champ"><label for="password">Mot de passe</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn btn-bleu btn-bloc" onclick="connexion()">Se connecter</button>
    <p style="text-align:center;font-size:13.5px;margin-top:14px">
      Pas encore de compte ? <a href="/inscription" style="color:var(--bleu);font-weight:600">Créer un compte</a>
    </p>
    <div style="background:var(--fond);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--texte-2);margin-top:16px">
      <b>Comptes de démonstration :</b><br>
      Admin : admin@oasis.ht / admin123<br>
      Enseignant : enseignant@oasis.ht / prof123<br>
      Apprenant : apprenant@oasis.ht / eleve123
    </div>
  </div>
</main>
<script src="/js/app.js"></script>
<script>
afficherEntete('');
afficherPied();

async function connexion() {
  const alerte = document.getElementById('alerte');
  alerte.className = 'alerte';
  try {
    const { token, user } = await API.post('/api/auth/connexion', {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    });
    Auth.enregistrer(token, user);
    const suite = param('suite', '/dashboard');
    location.href = suite.startsWith('/') && !suite.startsWith('//') ? suite : '/dashboard';
  } catch (e) {
    alerte.className = 'alerte erreur';
    alerte.textContent = e.message;
  }
}
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') connexion(); });
</script>
</body>
</html>
