<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajouter un outil éducatif - OASIS</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="app"></div>
<script src="/js/app.js"></script>
<script>
const contenu = `
  <section style="display:flex;gap:16px;align-items:center;margin:8px 0 18px">
    <span class="row-icon" style="width:64px;height:64px;font-size:32px">+</span>
    <div><h1>Ajouter un outil éducatif</h1><p style="color:var(--texte-2)">Partagez un outil numérique utile pour faciliter l’enseignement et l’apprentissage.</p></div>
  </section>
  ${wizardSteps(['Informations générales','Détails et contenu','Paramètres','Publication'])}
  <div class="builder-layout">
    <section>
      <div class="form-panel">
        <h3>Informations générales</h3>
        <div class="form-grid">
          <div class="champ"><label>Nom de l’outil *</label><input id="outil-nom" placeholder="Ex. : Quizizz, Canva, Kahoot!, Padlet..."></div>
          <div class="champ"><label>Catégorie *</label><select id="outil-categorie"><option>Création de contenu</option><option>Évaluation</option><option>Collaboration</option><option>Organisation</option></select></div>
          <div class="champ"><label>Sous-catégorie</label><select id="outil-sous-categorie"><option>Quiz</option><option>Présentation</option><option>Tableau collaboratif</option></select></div>
          <div class="champ"><label>Niveau scolaire cible *</label><select id="outil-niveau"><option>Primaire</option><option>Secondaire</option><option>Tout niveau</option></select></div>
        </div>
        <div class="champ"><label>Brève description *</label><textarea id="outil-description" rows="4" placeholder="Décrivez brièvement l’outil, son objectif et ses principaux avantages..."></textarea></div>
        <div class="form-grid">
          <div class="champ"><label>Langue de l’outil *</label><select id="outil-langue"><option>Français</option><option>Anglais</option><option>Multilingue</option></select></div>
          <div class="champ"><label>Type d’accès *</label><select id="outil-acces"><option>Gratuit</option><option>Freemium</option><option>Payant</option></select></div>
        </div>
      </div>
      <div class="form-panel">
        <h3>Lien et accès</h3>
        <div class="form-grid"><div class="champ"><label>Lien officiel de l’outil *</label><input id="outil-lien" placeholder="https://exemple.com"></div><div class="champ"><label>Lien direct</label><input id="outil-lien-direct" placeholder="Lien direct vers une ressource spécifique"></div></div>
      </div>
      <div class="form-panel">
        <h3>Image et média</h3>
        <div class="upload-grid">
          <div class="upload-zone">▧<br>Logo ou image de l’outil<br><button class="btn btn-contour btn-petit">Choisir un fichier</button></div>
          <div class="upload-zone">▧<br>Ajouter jusqu’à 5 images<br><button class="btn btn-contour btn-petit">Ajouter des images</button></div>
        </div>
      </div>
      <div class="form-panel">
        <h3>Compatibilité et exigences</h3>
        <div class="hero-chips" style="margin:10px 0"><span>Windows</span><span>macOS</span><span>Android</span><span>iOS</span><span style="background:var(--bleu);color:#fff">Web</span></div>
        <div class="champ"><label>Mots-clés</label><input id="outil-mots" placeholder="Ex. : évaluation, quiz, interactif, collaboration..."></div>
        <div class="footer-action"><a class="btn btn-contour" href="/outils-educatifs">Annuler</a><button class="btn btn-bleu" onclick="sauverOutil(true)">Suivant →</button></div>
      </div>
    </section>
    <aside>
      <div class="preview-card"><h3>Aperçu de l’outil</h3><div class="preview-visual" style="background:linear-gradient(135deg,#eef4ff,#fff);color:var(--violet)">▧</div><h3>Nom de l’outil <span class="pill purple">Catégorie</span></h3><p class="stars">★★☆☆☆ <small>(0)</small></p><p style="color:var(--texte-2)">Brève description de l’outil qui apparaîtra ici...</p></div>
      <div class="preview-card soft-callout"><h3>Bon à savoir</h3><p>Un outil bien décrit et illustré a plus de chances d’être utilisé par la communauté enseignante.</p></div>
      <div class="preview-card green-callout"><h3>Conseils pour une bonne contribution</h3><p>Choisissez une image claire, vérifiez le lien, ajoutez des mots-clés pertinents et respectez les droits d’auteur.</p></div>
    </aside>
  </div>
`;

document.getElementById('app').innerHTML = appShell('ajouter-outil', contenu, '', {
  search: 'Rechercher un outil, une ressource, une activité...',
  action: '<button class="btn btn-bleu btn-petit" onclick="sauverOutil()">Enregistrer</button>'
});

async function sauverOutil(rediriger = false) {
  const nom = valeurChamp('outil-nom');
  if (!nom) return toast('Le nom de l’outil est obligatoire.', 'erreur');
  await posterCreation('/api/outils', {
    nom,
    categorie: valeurChamp('outil-categorie'),
    sousCategorie: valeurChamp('outil-sous-categorie'),
    niveau: valeurChamp('outil-niveau'),
    description: valeurChamp('outil-description'),
    langue: valeurChamp('outil-langue'),
    typeAcces: valeurChamp('outil-acces'),
    licence: valeurChamp('outil-acces'),
    lien: valeurChamp('outil-lien'),
    lienDirect: valeurChamp('outil-lien-direct'),
    motsCles: valeurChamp('outil-mots'),
    plateformes: ['Web'],
    statut: 'brouillon',
    visibilite: 'prive'
  }, rediriger ? '/outils-educatifs' : '');
}
</script>
</body>
</html>
